name: Nightly Power Outages and Restoration Alerts

on:
  schedule:
    - cron: '*/15 0-5 * * *'
      timezone: Europe/Kyiv
  workflow_dispatch:
    inputs:
      mode:
        description: Operation (check only sends alerts during the night window)
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - check
          - test-email
          - test-restoration

permissions:
  contents: write

concurrency:
  group: svitlobot-nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOCAL_TIMEZONE: Europe/Kyiv
      NIGHT_START_HOUR: '0'
      NIGHT_END_HOUR: '6'
      NOTIFY_RESTORED: ${{ vars.NOTIFY_RESTORED || 'false' }}
      STATE_BACKEND: github
      STATE_BRANCH: svitlobot-state
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check channels or send test email
        env:
          MODE: ${{ inputs.mode || 'check' }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          case "$MODE" in
            dry-run) python monitor.py --dry-run ;;
            check) python monitor.py ;;
            test-email) python monitor.py --test-email ;;
            test-restoration) python monitor.py --test-restoration ;;
            *) exit 2 ;;
          esac